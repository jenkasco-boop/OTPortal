name: Deploy OT Portal (IIS)

# push เข้า cicd-deploy เมื่อไหร่ -> build + test บน GitHub-hosted แล้วส่งผลลัพธ์ให้ self-hosted runner deploy ขึ้น IIS
# server ไม่ต้องมี .NET SDK / Node แค่มี ASP.NET Core Hosting Bundle 9 สำหรับรันแอปใน IIS
# DEPLOY_TARGET ต้องเป็นโฟลเดอร์ของ OT Portal เท่านั้น! robocopy /MIR จะลบไฟล์อื่นทิ้ง

on:
  push:
    branches: [cicd-deploy]
  workflow_dispatch:

concurrency:
  group: otportal-deploy-iis
  cancel-in-progress: false

env:
  DEPLOY_TARGET: 'C:\inetpub\wwwroot\KascoOT'
  APP_POOL: 'web-kascoOT'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    # ถ้าไฟล์นี้หลุดไป repo อื่น จะไม่รัน
    if: github.repository == 'jenkasco-boop/OTPortal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Test
        run: dotnet test --configuration Release

      # UseAppHost=false -> web.config เรียก "dotnet OtPortal.Api.dll" ใช้ได้ทั้ง app pool 32/64-bit
      - name: Publish
        run: dotnet publish src/OtPortal.Api/OtPortal.Api.csproj --configuration Release --output publish -p:UseAppHost=false

      - uses: actions/upload-artifact@v4
        with:
          name: otportal-publish
          path: publish
          retention-days: 7

  deploy:
    needs: build
    runs-on: [self-hosted, windows]
    steps:
      - name: Check config
        shell: powershell
        run: |
          # Windows PowerShell 5.1 reads this script as ANSI, so Thai text inside strings breaks parsing - keep strings ASCII
          if (-not $env:DEPLOY_TARGET) { throw "DEPLOY_TARGET is not set" }
          if ($env:DEPLOY_TARGET -match '^[A-Za-z]:\\?$' -or $env:DEPLOY_TARGET -match '\\wwwroot\\?$') {
            throw "DEPLOY_TARGET '$env:DEPLOY_TARGET' is too broad - must be a folder dedicated to OT Portal"
          }

      - uses: actions/download-artifact@v4
        with:
          name: otportal-publish
          path: publish

      - name: Deploy to IIS
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force $env:DEPLOY_TARGET | Out-Null
          $offline = Join-Path $env:DEPLOY_TARGET "app_offline.htm"

          # app_offline.htm ทำให้ ASP.NET Core Module ปิดแอปและปลดล็อกไฟล์ dll
          Set-Content $offline '<html><body style="font-family:sans-serif"><h2>OT Portal &#3585;&#3635;&#3621;&#3633;&#3591;&#3629;&#3633;&#3611;&#3648;&#3604;&#3605; &#3585;&#3619;&#3640;&#3603;&#3634;&#3619;&#3629;&#3626;&#3633;&#3585;&#3588;&#3619;&#3641;&#3656;...</h2></body></html>' -Encoding UTF8
          if ($env:APP_POOL) {
            Import-Module WebAdministration
            if ((Get-WebAppPoolState $env:APP_POOL).Value -ne 'Stopped') { Stop-WebAppPool $env:APP_POOL }
          }
          Start-Sleep -Seconds 3

          try {
            # App_Data = ฐานข้อมูล SQLite ห้ามลบ / app_offline.htm ลบเองตอนท้าย
            robocopy (Join-Path $PWD "publish") $env:DEPLOY_TARGET /MIR /XD App_Data /XF app_offline.htm /R:5 /W:3 /NP /NFL /NDL
            if ($LASTEXITCODE -ge 8) { throw "robocopy failed with ExitCode $LASTEXITCODE" }
            $global:LASTEXITCODE = 0
          }
          finally {
            if ($env:APP_POOL) { Start-WebAppPool $env:APP_POOL }
            Remove-Item $offline -ErrorAction SilentlyContinue
          }

      - name: Smoke test
        shell: powershell
        if: ${{ vars.IIS_SITE_URL != '' }}
        run: |
          $r = Invoke-WebRequest "${{ vars.IIS_SITE_URL }}/api/employees" -UseBasicParsing -TimeoutSec 60
          if ($r.StatusCode -ne 200) { throw "Smoke test failed: $($r.StatusCode)" }
          Write-Host "OK $($r.StatusCode)"
